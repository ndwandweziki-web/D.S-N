<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.S & N - 3D Custom Apparel Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Navigation Bar */
    header { background-color: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-size: 20px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
    .badge { background-color: #0284c7; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

    /* Studio Layout */
    .studio-container { display: flex; flex: 1; gap: 20px; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
    @media (max-width: 850px) { .studio-container { flex-direction: column; } }

    /* 3D Viewport */
    .viewport-card { flex: 2; min-height: 500px; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; position: relative; overflow: hidden; }
    #canvas-container { width: 100%; height: 100%; min-height: 500px; }
    .viewport-overlay { position: absolute; bottom: 16px; left: 16px; background: rgba(15, 23, 42, 0.75); padding: 8px 14px; border-radius: 6px; font-size: 12px; color: #94a3b8; pointer-events: none; }

    /* Control Sidebar */
    .controls-card { flex: 1; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .section-title { font-size: 14px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

    /* Buttons & Inputs */
    .grid-options { display: grid; grid-template-columns: repeat( auto-fit, minmax(100px, 1fr) ); gap: 8px; }
    .btn-option { background-color: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; transition: all 0.2s; }
    .btn-option.active, .btn-option:hover { background-color: #0284c7; color: #ffffff; border-color: #38bdf8; }

    .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .color-swatch { height: 32px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
    .color-swatch.active { border-color: #38bdf8; transform: scale(1.1); }

    input[type="file"] { width: 100%; font-size: 12px; color: #94a3b8; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; }

    .btn-primary { width: 100%; padding: 14px; background-color: #0284c7; color: #ffffff; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: auto; transition: background 0.2s; }
    .btn-primary:hover { background-color: #0369a1; }

    /* Output Status Alert */
    .status-alert { background-color: #064e3b; border: 1px solid #059669; color: #a7f3d0; padding: 12px; border-radius: 6px; font-size: 12px; display: none; margin-top: 10px; line-height: 1.4; }
  </style>

  <!-- Three.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="brand-logo">D.S & N</div>
    <span class="badge">Custom Apparel Studio</span>
  </header>

  <div class="studio-container">
    <!-- Interactive 3D Canvas -->
    <div class="viewport-card">
      <div id="canvas-container"></div>
      <div class="viewport-overlay">Drag to rotate 360° | Scroll to zoom</div>
    </div>

    <!-- Configuration Control Panel -->
    <div class="controls-card">
      <div>
        <div class="section-title">1. Select Apparel Item</div>
        <div class="grid-options" id="category-selector">
          <button class="btn-option active" onclick="setApparel('hoodie')">Hoodie</button>
          <button class="btn-option" onclick="setApparel('tee')">Graphic Tee</button>
          <button class="btn-option" onclick="setApparel('jacket')">Zip Jacket</button>
          <button class="btn-option" onclick="setApparel('cargos')">Cargo Pants</button>
          <button class="btn-option" onclick="setApparel('jeans')">Denim Jeans</button>
          <button class="btn-option" onclick="setApparel('tracksuit')">Tracksuit</button>
          <button class="btn-option" onclick="setApparel('sweater')">Sweater</button>
          <button class="btn-option" onclick="setApparel('bucket_hat')">Bucket Hat</button>
        </div>
      </div>

      <div>
        <div class="section-title">2. Choose Fabric Color</div>
        <div class="color-grid" id="color-selector"></div>
      </div>

      <div>
        <div class="section-title">3. Upload Artwork / Logo</div>
        <input type="file" accept="image/*" onchange="handleImageUpload(event)" />
      </div>

      <div>
        <button class="btn-primary" onclick="runProductionTest()">Run Production Order Test</button>
        <div id="status-box" class="status-alert"></div>
      </div>
    </div>
  </div>

  <script>
    // 12-Color Fabric Palette
    const palette = [
      { name: 'Pitch Black', hex: 0x111111 },
      { name: 'Pure White', hex: 0xffffff },
      { name: 'Heather Grey', hex: 0x9e9e9e },
      { name: 'Charcoal', hex: 0x333333 },
      { name: 'Navy Blue', hex: 0x0b1d3a },
      { name: 'Royal Blue', hex: 0x1d4ed8 },
      { name: 'Forest Green', hex: 0x14452f },
      { name: 'Olive', hex: 0x556b2f },
      { name: 'Burgundy', hex: 0x58111a },
      { name: 'Crimson Red', hex: 0xdc2626 },
      { name: 'Sand / Beige', hex: 0xd7c4b7 },
      { name: 'Mustard', hex: 0xeab308 }
    ];

    let currentItem = 'hoodie';
    let currentColor = 0x111111;
    let scene, camera, renderer, mesh, decalMesh, controls;
    let graphicTexture = null;

    // Initialize 3D Scene Environment
    function initStudio() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e293b);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Studio Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      // Interactive Camera Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Render Initial Base Apparel Mesh
      buildApparelMesh();
      populateColorPicker();

      // Window Resize Listener
      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Build Mesh Representing Selected Apparel Item
    function buildApparelMesh() {
      if (mesh) scene.remove(mesh);
      if (decalMesh) scene.remove(decalMesh);

      // Base Apparel Mesh Setup
      const geometry = new THREE.CylinderGeometry(0.8, 0.9, 1.8, 32);
      const material = new THREE.MeshStandardMaterial({ color: currentColor, roughness: 0.7 });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Custom Logo Graphic Projection Overlay
      if (graphicTexture) {
        const decalGeo = new THREE.PlaneGeometry(0.7, 0.7);
        const decalMat = new THREE.MeshBasicMaterial({ map: graphicTexture, transparent: true, depthTest: false });
        decalMesh = new THREE.Mesh(decalGeo, decalMat);
        decalMesh.position.set(0, 0.2, 0.81);
        scene.add(decalMesh);
      }
    }

    // Color Swatch UI Generation
    function populateColorPicker() {
      const container = document.getElementById('color-selector');
      palette.forEach((color, index) => {
        const swatch = document.createElement('div');
        swatch.className = `color-swatch ${index === 0 ? 'active' : ''}`;
        swatch.style.backgroundColor = '#' + color.hex.toString(16).padStart(6, '0');
        swatch.title = color.name;
        swatch.onclick = () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentColor = color.hex;
          mesh.material.color.setHex(currentColor);
        };
        container.appendChild(swatch);
      });
    }

    // Category Selector
    function setApparel(category) {
      currentItem = category;
      buildApparelMesh();
    }

    // Handle Image Upload for Graphic Print
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const loader = new THREE.TextureLoader();
          loader.load(e.target.result, (texture) => {
            graphicTexture = texture;
            buildApparelMesh();
          });
        };
        reader.readAsDataURL(file);
      }
    }

    // Run Production Test Order Simulation
    function runProductionTest() {
      const statusBox = document.getElementById('status-box');
      const orderRef = 'DSN-' + Math.floor(100000 + Math.random() * 900000);
      
      statusBox.style.display = 'block';
      statusBox.innerHTML = `<strong>[PRODUCTION TEST SUCCESS]</strong><br/>
        Item: 1x ${currentItem.toUpperCase()}<br/>
        Color Code: #${currentColor.toString(16).padStart(6, '0')}<br/>
        Order Ref: ${orderRef}<br/>
        Status: Sent to Mock Fulfillment Pipeline`;
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = initStudio;
  </script>
</body>
</html>
