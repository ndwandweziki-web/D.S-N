<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>D.S & N | Enterprise 3D Studio</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(18, 24, 38, 0.98);
      --accent: #00e5ff;
      --accent-hover: #00b3cc;
      --text: #ffffff;
      --text-muted: #8a99ad;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text); }
    
    #app-container { display: flex; width: 100vw; height: 100vh; flex-direction: column; }
    @media (min-width: 900px) { #app-container { flex-direction: row; } }

    /* 3D Viewport Stage */
    #viewport-container { flex: 1; position: relative; width: 100%; height: 50%; background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%); }
    @media (min-width: 900px) { #viewport-container { height: 100%; } }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: grab; }
    
    .viewport-overlay { position: absolute; top: 12px; left: 12px; pointer-events: none; }
    .badge { background: rgba(0, 229, 255, 0.15); border: 1px solid var(--accent); color: var(--accent); font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }

    /* Sidebar Controls */
    #sidebar { flex: 1; height: 50%; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
    @media (min-width: 900px) { #sidebar { width: 420px; height: 100%; border-top: none; border-left: 1px solid var(--border); } }

    .sidebar-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
    .brand-title span { color: var(--accent); }

    .control-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }

    /* Category Navigation */
    .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

    /* Garment Selection Grid */
    .grid-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 4px; text-align: center; color: var(--text); font-size: 11px; cursor: pointer; }
    .grid-btn.active { border-color: var(--accent); background: rgba(0, 229, 255, 0.1); color: var(--accent); font-weight: 700; }

    /* Upload & Color Picker Tools */
    .tools-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .color-picker-input { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: transparent; }
    .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-input::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

    .upload-btn { flex: 1; background: rgba(255,255,255,0.08); border: 1px dashed var(--accent); color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; cursor: pointer; }
    
    /* Decal Transform Controls */
    .transform-controls { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .slider-group { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
    .slider-group input { width: 60%; accent-color: var(--accent); }

    .btn-action { width: 100%; background: var(--accent); color: #000; font-weight: 800; border: none; padding: 14px; border-radius: 8px; font-size: 13px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
  </style>

  <!-- Three.js + OrbitControls + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="app-container">
    <div id="viewport-container">
      <div class="viewport-overlay">
        <div class="badge">D.S & N 3D Engine v3.0</div>
      </div>
      <canvas id="canvas3d"></canvas>
    </div>

    <div id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">D.S <span>&</span> N</div>
        <div style="font-size: 11px; color: var(--accent);">3D Customizer</div>
      </div>

      <!-- Categories -->
      <div class="control-section">
        <div class="section-title">Categories</div>
        <div class="category-scroll">
          <button class="cat-btn active" onclick="filterCat('all', this)">All</button>
          <button class="cat-btn" onclick="filterCat('tops', this)">Tops</button>
          <button class="cat-btn" onclick="filterCat('bottoms', this)">Bottoms</button>
          <button class="cat-btn" onclick="filterCat('headwear', this)">Hats</button>
        </div>
      </div>

      <!-- Item Grid -->
      <div class="control-section">
        <div class="section-title">Select Apparel</div>
        <div class="grid-selector" id="itemGrid"></div>
      </div>

      <!-- Custom Upload & Full Color Wheel -->
      <div class="control-section">
        <div class="section-title">Fabric Color & Upload Custom Design</div>
        <div class="tools-row">
          <input type="color" id="hexPicker" class="color-picker-input" value="#111111" onchange="updateFabricColor(this.value)" />
          <label class="upload-btn">
            📷 Upload From Phone
            <input type="file" id="imageUploader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)" />
          </label>
        </div>

        <div class="transform-controls">
          <div class="slider-group">
            <span>Design Size</span>
            <input type="range" id="decalScale" min="0.1" max="1.0" step="0.05" value="0.3" oninput="updateDecalTransform()" />
          </div>
          <div class="slider-group">
            <span>Position Y</span>
            <input type="range" id="decalPosY" min="-0.5" max="0.5" step="0.02" value="0" oninput="updateDecalTransform()" />
          </div>
          <div class="slider-group">
            <span>Position X</span>
            <input type="range" id="decalPosX" min="-0.5" max="0.5" step="0.02" value="0" oninput="updateDecalTransform()" />
          </div>
        </div>
      </div>

      <div class="control-section">
        <button class="btn-action" onclick="alert('Order specification captured! Exporting 3D render...')">Submit Custom Order</button>
      </div>
    </div>
  </div>

  <script>
    // Remote 3D GLTF Model Catalog
    const catalog = [
      { id: 'shirt', name: 'T-Shirt', cat: 'tops', url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Shirt/glTF-Binary/Shirt.glb' },
      { id: 'hoodie', name: 'Hoodie Base', cat: 'tops', url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Corset/glTF-Binary/Corset.glb' },
      { id: 'cap', name: 'Hat / Cap', cat: 'headwear', url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb' }
    ];

    let currentItem = catalog[0];
    let scene, camera, renderer, controls, loadedMesh, loader;
    let customTexture = null;

    window.addEventListener('load', () => {
      init3D();
      renderGrid('all');
      load3DModel(currentItem.url);
    });

    function init3D() {
      const container = document.getElementById('viewport-container');
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 0, 2.5);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      loader = new THREE.GLTFLoader();

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function load3DModel(url) {
      if (loadedMesh) scene.remove(loadedMesh);

      loader.load(url, (gltf) => {
        loadedMesh = gltf.scene;
        
        // Center model automatically
        const box = new THREE.Box3().setFromObject(loadedMesh);
        const center = box.getCenter(new THREE.Vector3());
        loadedMesh.position.sub(center);
        
        scene.add(loadedMesh);
        updateFabricColor(document.getElementById('hexPicker').value);
      });
    }

    function updateFabricColor(hex) {
      if (!loadedMesh) return;
      loadedMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.color = new THREE.Color(hex);
        }
      });
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          customTexture = new THREE.Texture(img);
          customTexture.needsUpdate = true;
          applyTextureToMesh();
        };
      };
      reader.readAsDataURL(file);
    }

    function applyTextureToMesh() {
      if (!loadedMesh || !customTexture) return;
      loadedMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.map = customTexture;
          child.material.needsUpdate = true;
        }
      });
    }

    function renderGrid(cat) {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      const items = cat === 'all' ? catalog : catalog.filter(i => i.cat === cat);

      items.forEach(item => {
        const btn = document.createElement('div');
        btn.className = `grid-btn ${item.id === currentItem.id ? 'active' : ''}`;
        btn.innerText = item.name;
        btn.onclick = () => {
          document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentItem = item;
          load3DModel(item.url);
        };
        grid.appendChild(btn);
      });
    }

    function filterCat(cat, el) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderGrid(cat);
    }
  </script>
</body>
</html>
