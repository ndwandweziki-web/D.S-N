<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>D.S & N | Next-Gen 3D Studio</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(18, 24, 38, 0.95);
      --accent: #00e5ff;
      --accent-hover: #00b3cc;
      --text: #ffffff;
      --text-muted: #8a99ad;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text); }
    
    #app-container { display: flex; width: 100vw; height: 100vh; flex-direction: column; }
    @media (min-width: 900px) { #app-container { flex-direction: row; } }

    /* 3D Viewport */
    #viewport-container { flex: 1; position: relative; width: 100%; height: 55%; background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%); }
    @media (min-width: 900px) { #viewport-container { height: 100%; } }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: grab; }
    #canvas3d:active { cursor: grabbing; }

    /* Floating Viewport Controls */
    .viewport-overlay { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .badge { background: rgba(0, 229, 255, 0.15); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; width: fit-content; }
    .nav-hint { font-size: 12px; color: var(--text-muted); background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; backdrop-filter: blur(4px); }

    /* Studio Customizer Panel */
    #sidebar { flex: 1; height: 45%; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
    @media (min-width: 900px) { #sidebar { width: 420px; height: 100%; border-top: none; border-left: 1px solid var(--border); } }

    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-weight: 800; font-size: 18px; letter-spacing: 1.5px; color: #fff; }
    .brand-title span { color: var(--accent); }

    .control-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Horizontal Categories bar (Shein Style) */
    .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #ccc; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn.active, .cat-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

    /* Grid Items */
    .grid-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 4px; text-align: center; color: var(--text); font-size: 11px; cursor: pointer; transition: 0.2s; }
    .grid-btn.active { border-color: var(--accent); background: rgba(0, 229, 255, 0.1); color: var(--accent); font-weight: 700; }

    /* Swatches */
    .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .swatch.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

    /* Sticker Generator & Controls */
    .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .sticker-preset { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); background: #151c2c; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; }
    .sticker-preset:hover { border-color: var(--accent); transform: scale(1.05); }

    .transform-controls { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
    .slider-group { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    .slider-group input { width: 60%; accent-color: var(--accent); }

    .btn-action { width: 100%; background: var(--accent); color: #000; font-weight: 800; border: none; padding: 14px; border-radius: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-action:hover { background: var(--accent-hover); box-shadow: 0 0 15px rgba(0, 225, 255, 0.4); }

    /* Off-screen decal compositing canvas */
    #textureCanvas { display: none; }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="app-container">
    <!-- Interactive 3D Canvas -->
    <div id="viewport-container">
      <div class="viewport-overlay">
        <div class="badge">D.S & N Studio v2.0</div>
        <div class="nav-hint">🖱️ Drag to rotate 360° | Scroll / Pinch to Zoom | Right-click to Pan</div>
      </div>
      <canvas id="canvas3d"></canvas>
    </div>

    <!-- Controls Sidebar -->
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">D.S <span>&</span> N</div>
        <div style="font-size: 12px; color: var(--accent);">Customizer</div>
      </div>

      <!-- Category Filter Bar (Shein Style Nav) -->
      <div class="control-section">
        <div class="section-title">Apparel Category</div>
        <div class="category-scroll">
          <button class="cat-btn active" onclick="filterCat('all')">All Items</button>
          <button class="cat-btn" onclick="filterCat('tops')">Tops & Sweaters</button>
          <button class="cat-btn" onclick="filterCat('bottoms')">Bottoms & Pants</button>
          <button class="cat-btn" onclick="filterCat('outerwear')">Outerwear & Suits</button>
          <button class="cat-btn" onclick="filterCat('headwear')">Hats & Caps</button>
          <button class="cat-btn" onclick="filterCat('acc')">Accessories & Socks</button>
        </div>
      </div>

      <!-- Item Mesh Selector -->
      <div class="control-section">
        <div class="section-title">Select Garment</div>
        <div class="grid-selector" id="itemGrid">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Fabric Color Swatches -->
      <div class="control-section">
        <div class="section-title">Fabric Color</div>
        <div class="color-swatches">
          <div class="swatch active" style="background:#111111" onclick="setColor('#111111', this)"></div>
          <div class="swatch" style="background:#ffffff" onclick="setColor('#ffffff', this)"></div>
          <div class="swatch" style="background:#e63946" onclick="setColor('#e63946', this)"></div>
          <div class="swatch" style="background:#1d3557" onclick="setColor('#1d3557', this)"></div>
          <div class="swatch" style="background:#2a9d8f" onclick="setColor('#2a9d8f', this)"></div>
          <div class="swatch" style="background:#f4a261" onclick="setColor('#f4a261', this)"></div>
          <div class="swatch" style="background:#6a0572" onclick="setColor('#6a0572', this)"></div>
          <div class="swatch" style="background:#4a5759" onclick="setColor('#4a5759', this)"></div>
        </div>
      </div>

      <!-- AI Stickers & Graphics Panel -->
      <div class="control-section">
        <div class="section-title">AI Graphics & Stickers</div>
        <div class="sticker-grid">
          <div class="sticker-preset" onclick="setSticker('⚡')">⚡</div>
          <div class="sticker-preset" onclick="setSticker('🔥')">🔥</div>
          <div class="sticker-preset" onclick="setSticker('👑')">👑</div>
          <div class="sticker-preset" onclick="setSticker('🌐')">🌐</div>
          <div class="sticker-preset" onclick="setSticker('👾')">👾</div>
          <div class="sticker-preset" onclick="setSticker('💎')">💎</div>
          <div class="sticker-preset" onclick="setSticker('🐉')">🐉</div>
          <div class="sticker-preset" onclick="setSticker('🦅')">🦅</div>
        </div>

        <div class="transform-controls">
          <div class="slider-group">
            <span>Sticker Size</span>
            <input type="range" id="sizeSlider" min="50" max="300" value="120" oninput="updateStickerTransform()" />
          </div>
          <div class="slider-group">
            <span>Position Y</span>
            <input type="range" id="posYSlider" min="-150" max="150" value="0" oninput="updateStickerTransform()" />
          </div>
          <div class="slider-group">
            <span>Position X</span>
            <input type="range" id="posXSlider" min="-150" max="150" value="0" oninput="updateStickerTransform()" />
          </div>
        </div>
      </div>

      <!-- Production Order Callout -->
      <div class="control-section">
        <button class="btn-action" onclick="alert('Order configuration saved! Rendering production package...')">Order Custom Build</button>
      </div>
    </div>
  </div>

  <!-- Off-Screen Dynamic Texture Composite Engine Canvas -->
  <canvas id="textureCanvas" width="1024" height="1024"></canvas>

  <script>
    // Global Catalog Registry
    const catalog = [
      { id: 'hoodie', name: 'Hoodie', cat: 'tops', geometry: createHoodieGeo },
      { id: 'tee', name: 'Graphic Tee', cat: 'tops', geometry: createTeeGeo },
      { id: 'sweater', name: 'Sweater', cat: 'tops', geometry: createSweaterGeo },
      { id: 'cargo', name: 'Cargo Pants', cat: 'bottoms', geometry: createCargoGeo },
      { id: 'jeans', name: 'Denim Jeans', cat: 'bottoms', geometry: createJeansGeo },
      { id: 'skirt', name: 'Dress / Skirt', cat: 'bottoms', geometry: createSkirtGeo },
      { id: 'suit', name: 'Blazer / Suit', cat: 'outerwear', geometry: createSuitGeo },
      { id: 'tracksuit', name: 'Track Jacket', cat: 'outerwear', geometry: createTrackGeo },
      { id: 'cap', name: 'Snapback Cap', cat: 'headwear', geometry: createCapGeo },
      { id: 'bucket', name: 'Bucket Hat', cat: 'headwear', geometry: createBucketGeo },
      { id: 'socks', name: 'Crew Socks', cat: 'acc', geometry: createSocksGeo }
    ];

    let currentItem = catalog[0];
    let currentColor = '#111111';
    let currentSticker = '⚡';

    // Three.js Engine Variables
    let scene, camera, renderer, controls, garmentMesh;
    let dynamicTexture, canvas2d, ctx2d;

    // Initialize Application Engine
    window.addEventListener('load', () => {
      init2DEngine();
      init3DEngine();
      renderCategoryUI('all');
      loadGarment(currentItem);
    });

    // --- 2D CANVAS TEXTURE ENGINE (Dynamic Procedural Texture Generation) ---
    function init2DEngine() {
      canvas2d = document.getElementById('textureCanvas');
      ctx2d = canvas2d.getContext('2d');
      updateCanvasTexture();
      dynamicTexture = new THREE.CanvasTexture(canvas2d);
    }

    function updateCanvasTexture() {
      // Background Fabric Color
      ctx2d.fillStyle = currentColor;
      ctx2d.fillRect(0, 0, 1024, 1024);

      // Subtle Fabric Texture Weave Simulation
      ctx2d.fillStyle = "rgba(255, 255, 255, 0.03)";
      for (let i = 0; i < 1024; i += 4) {
        ctx2d.fillRect(i, 0, 2, 1024);
      }

      // Draw Active Graphic Sticker
      const size = parseInt(document.getElementById('sizeSlider').value);
      const posX = 512 + parseInt(document.getElementById('posXSlider').value);
      const posY = 512 - parseInt(document.getElementById('posYSlider').value);

      ctx2d.font = `${size}px sans-serif`;
      ctx2d.textAlign = "center";
      ctx2d.textBaseline = "middle";
      ctx2d.fillText(currentSticker, posX, posY);

      if (dynamicTexture) dynamicTexture.needsUpdate = true;
    }

    function updateStickerTransform() {
      updateCanvasTexture();
    }

    function setSticker(symbol) {
      currentSticker = symbol;
      updateCanvasTexture();
    }

    function setColor(colorHex, el) {
      currentColor = colorHex;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      updateCanvasTexture();
    }

    // --- 3D THREE.JS ENGINE SETUP ---
    function init3DEngine() {
      const container = document.getElementById('viewport-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 4.5);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      // Studio Lighting Hierarchy
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x00e5ff, 0.3);
      dirLight2.position.set(-5, -5, -5);
      scene.add(dirLight2);

      // Orbit Navigation System
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 10;
      controls.minDistance = 1.5;

      window.addEventListener('resize', onWindowResize);

      // Render Loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('viewport-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // --- PROCEDURAL 3D MESH GENERATION SYSTEM ---
    function loadGarment(item) {
      if (garmentMesh) scene.remove(garmentMesh);

      const material = new THREE.MeshStandardMaterial({
        map: dynamicTexture,
        roughness: 0.6,
        metalness: 0.1
      });

      const geometry = item.geometry();
      garmentMesh = new THREE.Mesh(geometry, material);
      scene.add(garmentMesh);
    }

    // Procedural Geometries for Catalog Items
    function createTeeGeo() {
      const group = new THREE.BufferGeometry();
      return new THREE.CylinderGeometry(0.8, 0.85, 1.8, 32);
    }
    function createHoodieGeo() {
      return new THREE.CylinderGeometry(0.9, 0.95, 2.0, 32);
    }
    function createSweaterGeo() {
      return new THREE.CylinderGeometry(0.85, 0.85, 1.9, 32);
    }
    function createCargoGeo() {
      return new THREE.CylinderGeometry(0.6, 0.5, 2.2, 32);
    }
    function createJeansGeo() {
      return new THREE.CylinderGeometry(0.55, 0.45, 2.2, 32);
    }
    function createSkirtGeo() {
      return new THREE.ConeGeometry(1.2, 1.6, 32);
    }
    function createSuitGeo() {
      return new THREE.BoxGeometry(1.4, 2.0, 0.8);
    }
    function createTrackGeo() {
      return new THREE.CylinderGeometry(0.85, 0.8, 1.9, 32);
    }
    function createCapGeo() {
      return new THREE.SphereGeometry(0.8, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
    }
    function createBucketGeo() {
      return new THREE.CylinderGeometry(0.6, 1.1, 0.8, 32);
    }
    function createSocksGeo() {
      return new THREE.CylinderGeometry(0.3, 0.3, 1.4, 32);
    }

    // --- UI CATEGORY & ITEM RENDERING ---
    function renderCategoryUI(catFilter) {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';

      const items = catFilter === 'all' ? catalog : catalog.filter(i => i.cat === catFilter);

      items.forEach(item => {
        const btn = document.createElement('div');
        btn.className = `grid-btn ${item.id === currentItem.id ? 'active' : ''}`;
        btn.innerText = item.name;
        btn.onclick = () => {
          document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentItem = item;
          loadGarment(item);
        };
        grid.appendChild(btn);
      });
    }

    function filterCat(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderCategoryUI(cat);
    }
  </script>
</body>
</html>
