<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boma Wear Pro 3D Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation -->
    <header class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center z-20">
        <div>
            <h1 class="font-black text-sm tracking-wider uppercase text-indigo-400">Boma Wear Pro Studio</h1>
            <p id="active-mode" class="text-xs text-gray-400">Mode: 3D Realistic Garment Customizer</p>
        </div>
        <button onclick="toggleInspirationModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-bold transition">✨ AI Inspiration Gallery</button>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- 3D Viewport with 2D Decal Overlay Layer -->
        <div id="canvas-container" class="flex-1 h-full relative cursor-grab active:cursor-grabbing bg-gradient-to-b from-gray-900 to-gray-950 flex items-center justify-center">
            
            <!-- Interactive Drag & Drop Decal / Text Layer anchored over the 3D model -->
            <div id="decal-overlay" class="absolute hidden border border-dashed border-indigo-400 bg-indigo-500/10 p-2 select-none flex items-center justify-center cursor-move" style="width: 120px; height: 120px; top: 40%; left: 45%; touch-action: none;">
                <img id="user-decal-img" src="" class="w-full h-full object-contain pointer-events-none hidden" alt="Decal">
                <span id="user-decal-text" class="text-xs font-bold text-white text-center drop-shadow-md"></span>
            </div>
        </div>

        <!-- Customization Control Center -->
        <div class="w-91 bg-gray-900 border-l border-gray-800 p-4 flex flex-col h-full overflow-y-auto space-y-5 z-20">
            
            <!-- Category Selection -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Garment Type</label>
                <select id="garment-select" onchange="changeGarment(this.value)" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm font-semibold focus:outline-none focus:border-indigo-500">
                    <option value="tshirt">Classic T-Shirt</option>
                    <option value="hoodie">Heavyweight Hoodie</option>
                    <option value="jacket">Techwear Jacket / Suit</option>
                    <option value="pants">Streetwear Pants / Trousers</option>
                    <option value="cap">Snapback Cap / Beanie</option>
                </select>
            </div>

            <!-- Multi-Zone Color Painting -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Multi-Zone Color Palette</label>
                <div class="space-y-2">
                    <div class="flex items-center justify-between bg-gray-800 p-2 rounded">
                        <span class="text-xs text-gray-300">Torso / Main Body</span>
                        <input type="color" value="#ffffff" onchange="setZoneColor('torso', this.value)" class="w-6 h-6 rounded bg-transparent border-0 cursor-pointer">
                    </div>
                    <div class="flex items-center justify-between bg-gray-800 p-2 rounded">
                        <span class="text-xs text-gray-300">Sleeves / Accents</span>
                        <input type="color" value="#ffffff" onchange="setZoneColor('sleeves', this.value)" class="w-6 h-6 rounded bg-transparent border-0 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Fabric Finish -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Realistic Fabric Weave</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setMaterial('cotton')" class="p-2 text-xs font-semibold bg-gray-800 hover:bg-indigo-600 rounded border border-gray-700">Combed Cotton</button>
                    <button onclick="setMaterial('silk')" class="p-2 text-xs font-semibold bg-gray-800 hover:bg-indigo-600 rounded border border-gray-700">Satin / Silk</button>
                    <button onclick="setMaterial('denim')" class="p-2 text-xs font-semibold bg-gray-800 hover:bg-indigo-600 rounded border border-gray-700">Heavy Denim</button>
                    <button onclick="setMaterial('leather')" class="p-2 text-xs font-semibold bg-gray-800 hover:bg-indigo-600 rounded border border-gray-700">Matte Leather</button>
                </div>
            </div>

            <!-- Graphic & Text Customizer -->
            <div class="space-y-3 pt-2 border-t border-gray-800">
                <label class="block text-xs font-bold uppercase tracking-widest text-indigo-400">Add Graphics & Text</label>
                
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Upload Design Image</label>
                    <input type="file" id="image-input" accept="image/*" class="block w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-gray-800 file:text-white hover:file:bg-gray-700 cursor-pointer">
                </div>

                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Custom Text Overlay</label>
                    <input type="text" id="text-input" placeholder="Type custom text..." oninput="updateTextOverlay(this.value)" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex space-x-2">
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400 mb-1">Text Color</label>
                        <input type="color" value="#000000" onchange="setTextColor(this.value)" class="w-full h-7 rounded bg-gray-800 border border-gray-700 cursor-pointer">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400 mb-1">Scale Size</label>
                        <input type="range" min="50" max="250" value="120" oninput="resizeDecal(this.value)" class="w-full accent-indigo-500 mt-2">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- AI Inspiration Modal Overlay -->
    <div id="inspiration-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h2 class="font-extrabold text-base text-indigo-400 uppercase tracking-wider">AI Inspiration & Theme Gallery</h2>
                <button onclick="toggleInspirationModal()" class="text-gray-400 hover:text-white font-bold text-lg">✕</button>
            </div>
            <p class="text-xs text-gray-400">Select an AI-curated design concept to instantly style your apparel base:</p>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <button onclick="applyTheme('Anime Cyberpunk', '#ff0055', '#00ffff')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">⚡ Anime Cyberpunk</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Neon accents & sci-fi motifs</span>
                </button>
                <button onclick="applyTheme('Cinematic Noir', '#111111', '#cccccc')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">🎬 Movie Star Minimal</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Sleek monochromatic styling</span>
                </button>
                <button onclick="applyTheme('Deep Space', '#0b0b1a', '#7c3aed')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">🌌 Deep Space</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Cosmic gradients & starlight</span>
                </button>
                <button onclick="applyTheme('Apex Predator', '#3f1f0a', '#b45309')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">🐅 Animal Instinct</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Bold predator prints</span>
                </button>
                <button onclick="applyTheme('Hypercar Carbon', '#1f2937', '#ef4444')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">🏎️ Car Culture</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Racing stripes & carbon tones</span>
                </button>
                <button onclick="applyTheme('Botanical Earth', '#064e3b', '#10b981')" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-left border border-gray-700 transition">
                    <span class="block text-xs font-bold text-indigo-300">🌿 Organic Nature</span>
                    <span class="block text-[10px] text-gray-400 mt-1">Earthy tones & flora</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Three.js High-End Photorealistic Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Studio Multi-Point Lighting for Cinematic Gloss & Depth
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
        keyLight.position.set(4, 7, 5);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0x90b0ff, 1.0);
        fillLight.position.set(-5, 3, -3);
        scene.add(fillLight);

        // Multi-Material Zones for Color Blocking
        const torsoMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.05 });
        const sleeveMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.05 });

        let garmentGroup = new THREE.Group();
        scene.add(garmentGroup);

        function buildRealisticGarment(type) {
            garmentGroup.clear();
            let mainGeo, sleeveGeo;

            if (type === 'tshirt') {
                mainGeo = new THREE.CylinderGeometry(0.55, 0.65, 1.3, 64);
                const mainMesh = new THREE.Mesh(mainGeo, torsoMaterial);
                garmentGroup.add(mainMesh);
            } else if (type === 'hoodie') {
                mainGeo = new THREE.BoxGeometry(1.05, 1.35, 0.55);
                const mainMesh = new THREE.Mesh(mainGeo, torsoMaterial);
                garmentGroup.add(mainMesh);
            } else if (type === 'pants') {
                mainGeo = new THREE.CylinderGeometry(0.38, 0.32, 1.7, 64);
                const mainMesh = new THREE.Mesh(mainGeo, torsoMaterial);
                garmentGroup.add(mainMesh);
            } else {
                mainGeo = new THREE.SphereGeometry(0.48, 32, 32);
                const mainMesh = new THREE.Mesh(mainGeo, torsoMaterial);
                garmentGroup.add(mainMesh);
            }
        }

        buildRealisticGarment('tshirt');

        function changeGarment(type) {
            buildRealisticGarment(type);
        }

        function setZoneColor(zone, colorHex) {
            if (zone === 'torso') torsoMaterial.color.set(colorHex);
            if (zone === 'sleeves') sleeveMaterial.color.set(colorHex);
        }

        function setMaterial(fabric) {
            if (fabric === 'cotton') {
                torsoMaterial.roughness = 0.9; torsoMaterial.metalness = 0.0;
            } else if (fabric === 'silk') {
                torsoMaterial.roughness = 0.2; torsoMaterial.metalness = 0.4;
            } else if (fabric === 'denim') {
                torsoMaterial.roughness = 0.85; torsoMaterial.metalness = 0.1;
            } else if (fabric === 'leather') {
                torsoMaterial.roughness = 0.4; torsoMaterial.metalness = 0.2;
            }
        }

        // UI Decal & Text Management
        const overlay = document.getElementById('decal-overlay');
        const decalImg = document.getElementById('user-decal-img');
        const decalText = document.getElementById('user-decal-text');

        document.getElementById('image-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                decalImg.src = evt.target.result;
                decalImg.classList.remove('hidden');
                overlay.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        });

        function updateTextOverlay(val) {
            if (val.trim() !== '') {
                decalText.innerText = val;
                overlay.classList.remove('hidden');
            } else {
                decalText.innerText = '';
                if (decalImg.classList.contains('hidden')) overlay.classList.add('hidden');
            }
        }

        function setTextColor(hex) {
            decalText.style.color = hex;
        }

        function resizeDecal(size) {
            overlay.style.width = `${size}px`;
            overlay.style.height = `${size}px`;
        }

        function toggleInspirationModal() {
            const modal = document.getElementById('inspiration-modal');
            modal.classList.toggle('hidden');
        }

        function applyTheme(name, primaryColor, accentColor) {
            setZoneColor('torso', primaryColor);
            setZoneColor('sleeves', accentColor);
            updateTextOverlay(name);
            toggleInspirationModal();
        }

        // Drag & Rotate Mechanics for 3D Viewport
        let isDragging = false, prevX = 0, prevY = 0;
        container.addEventListener('pointerdown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            garmentGroup.rotation.y += (e.clientX - prevX) * 0.01;
            prevX = e.clientX;
        });
        container.addEventListener('pointerup', () => { isDragging = false; });

        // Decal Overlay Touch/Mouse Dragging
        let isDecalDragging = false, startX, startY;
        overlay.addEventListener('pointerdown', (e) => {
            isDecalDragging = true;
            startX = e.clientX - overlay.offsetLeft;
            startY = e.clientY - overlay.offsetTop;
            overlay.setPointerCapture(e.pointerId);
            e.stopPropagation();
        });
        overlay.addEventListener('pointermove', (e) => {
            if (!isDecalDragging) return;
            overlay.style.left = `${e.clientX - startX}px`;
            overlay.style.top = `${e.clientY - startY}px`;
        });
        overlay.addEventListener('pointerup', (e) => {
            isDecalDragging = false;
            overlay.releasePointerCapture(e.pointerId);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
