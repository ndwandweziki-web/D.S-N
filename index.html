<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boma Wear 3D Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation -->
    <header class="p-3 bg-gray-900 border-b border-gray-800 flex justify-between items-center z-20">
        <div>
            <h1 class="font-black text-xs tracking-wider uppercase text-indigo-400">Boma Wear 3D Studio</h1>
            <p id="status-text" class="text-[10px] text-gray-400">Status: Loading 3D Asset...</p>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-col md:flex-row flex-1 relative overflow-hidden">
        
        <!-- 3D Viewport -->
        <div id="canvas-container" class="flex-1 h-3/5 md:h-full relative cursor-grab active:cursor-grabbing bg-gradient-to-b from-gray-900 to-gray-950 flex items-center justify-center"></div>

        <!-- Customization Control Center -->
        <div class="w-full md:w-80 bg-gray-900 border-t md:border-t-0 md:border-l border-gray-800 p-4 flex flex-col h-2/5 md:h-full overflow-y-auto space-y-4 z-20">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Model Color Customizer</label>
                <div class="flex items-center space-x-3">
                    <button onclick="setModelColor('#ffffff')" class="w-8 h-8 rounded-full bg-white border-2 border-gray-400 shadow cursor-pointer"></button>
                    <button onclick="setModelColor('#111827')" class="w-8 h-8 rounded-full bg-gray-900 border-2 border-gray-700 cursor-pointer"></button>
                    <button onclick="setModelColor('#1e3a8a')" class="w-8 h-8 rounded-full bg-blue-900 border-2 border-blue-700 cursor-pointer"></button>
                    <button onclick="setModelColor('#991b1b')" class="w-8 h-8 rounded-full bg-red-800 border-2 border-red-600 cursor-pointer"></button>
                    <input type="color" onchange="setModelColor(this.value)" class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer" title="Custom Hex">
                </div>
            </div>
            <p class="text-[11px] text-gray-400 leading-relaxed">Rotate the 3D garment freely with your finger or mouse. Select any color swatch to instantly paint the loaded 3D model.</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        let loadedModel = null;

        // Load an actual public 3D GLB Model Asset directly into Three.js
        const loader = new THREE.GLTFLoader();
        // Using a reliable public sample model URI to demonstrate real GLB rendering
        loader.load(
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
            function (gltf) {
                loadedModel = gltf.scene;
                loadedModel.scale.set(0.8, 0.8, 0.8);
                scene.add(loadedModel);
                document.getElementById('status-text').innerText = 'Status: Model Loaded Successfully';
            },
            undefined,
            function (error) {
                document.getElementById('status-text').innerText = 'Status: Error loading asset';
                console.error(error);
            }
        );

        function setModelColor(hexColor) {
            if (!loadedModel) return;
            loadedModel.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.color.set(hexColor);
                }
            });
        }

        // Drag to Rotate Interaction
        let isDragging = false, prevX = 0;
        container.addEventListener('pointerdown', (e) => { isDragging = true; prevX = e.clientX; });
        container.addEventListener('pointermove', (e) => {
            if (!isDragging || !loadedModel) return;
            loadedModel.rotation.y += (e.clientX - prevX) * 0.01;
            prevX = e.clientX;
        });
        container.addEventListener('pointerup', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
